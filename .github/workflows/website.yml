name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: '4.151.0'
  WEBSITE_URL: 'https://cinnabar.cinnabar-api.workers.dev'
  DEV_URL: 'https://cinnabar-dev.cinnabar-api.workers.dev'

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test website and deployment boundary
        run: |
          npm ci
          python3 mdbook.py
          python3 source.py fetch
          python3 render.py
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate the Cloudflare configuration
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --env dev
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: dist/

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: website
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        with:
          name: website
          path: dist
      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy
      - name: Check every published file
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            curl --fail --location --retry 3 "$WEBSITE_URL/${file#dist/}?release=$GITHUB_SHA" \
              -o "$RUNNER_TEMP/served"
            cmp "$file" "$RUNNER_TEMP/served"
          done < <(find dist -type f -print0)

  # Every commit to a pull request from this repository replaces the preview at
  # dev.cinnabar.gg. Fork PRs never deploy. The marketplace API only accepts the
  # production origin, so the preview uses the labelled mock marketplace.
  deploy-dev:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: website
    timeout-minutes: 10
    concurrency:
      group: website-dev
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Render the preview
        run: |
          npm ci
          python3 mdbook.py
          python3 source.py fetch
          python3 render.py --marketplace-backend mock
      - name: Publish to dev.cinnabar.gg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --env dev
      - name: Check every published file
        run: |
          set -euo pipefail
          # Cloudflare can serve the previous version for a few seconds after a deploy,
          # so each file gets up to a minute to match before the check fails.
          while IFS= read -r -d '' file; do
            for attempt in $(seq 12); do
              curl --fail --silent --show-error --location --retry 3 \
                "$DEV_URL/${file#dist/}?release=$GITHUB_SHA&attempt=$attempt" -o "$RUNNER_TEMP/served"
              cmp --silent "$file" "$RUNNER_TEMP/served" && break
              [ "$attempt" -lt 12 ] || { cmp "$file" "$RUNNER_TEMP/served"; exit 1; }
              sleep 5
            done
          done < <(find dist -type f -print0)
      - name: Summarize
        run: echo "Preview of ${{ github.event.pull_request.head.sha }} is live at https://dev.cinnabar.gg/" >> "$GITHUB_STEP_SUMMARY"
